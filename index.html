<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f95808" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Streetvend" />
    <meta name="application-name" content="Streetvend" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-512.jpg" />
    <link rel="icon" type="image/jpeg" sizes="512x512" href="/icon-512.jpg" />
    <link rel="shortcut icon" href="/icon-512.jpg" />
    <title>Streetvend | VeloAI</title>
    <script>
      (function() {
        const theme = localStorage.getItem('streetvend_theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <script>
      window.addEventListener('error', (event) => {
        fetch('/api/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'error', message: event.message, filename: event.filename, lineno: event.lineno })
        }).catch(() => {});
      });
      window.addEventListener('unhandledrejection', (event) => {
        fetch('/api/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'unhandledrejection', reason: event.reason ? event.reason.toString() : 'Unknown reason' })
        }).catch(() => {});
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Streetvend SW registered:', reg.scope))
            .catch(err => console.error('Streetvend SW registration failed:', err));
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
